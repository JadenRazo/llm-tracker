services:
  claude-tracker:
    build: .
    container_name: claude-tracker
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    ports:
      - "127.0.0.1:3200:3000"
    environment:
      # Connect directly to shared-postgres over the shared_network (no host-loopback hop).
      # Set in .env — never commit credentials to the compose file.
      - DATABASE_URL=${DATABASE_URL:?set DATABASE_URL in .env}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - ADMIN_TOKEN=${ADMIN_TOKEN}
      - NODE_ENV=production
    networks:
      - shared
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  shared:
    name: shared-infrastructure_shared_network
    external: true
