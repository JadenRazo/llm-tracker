services:
  llm-tracker:
    build: .
    container_name: llm-tracker
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    ports:
      - "127.0.0.1:3200:3000"
    environment:
      # Connect directly to shared-postgres over the shared_network (no host-loopback hop).
      # NOTE: the `claude_tracker` DB name is the existing physical database;
      # renaming it is a data migration (out of scope here), not a rebrand string.
      - DATABASE_URL=postgresql://portfolio_admin:portfol10Adm1nP%40ssw0rd@shared-postgres:5432/claude_tracker
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://llm.raizhost.com}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - ADMIN_TOKEN=${ADMIN_TOKEN}
      - NODE_ENV=production
    networks:
      - shared
    healthcheck:
      # Hit /api/health, not /. Probing / triggered full RSC SSR streaming,
      # and wget --spider closes the connection mid-stream → Next.js 15
      # throws "controller[kState].transformAlgorithm is not a function"
      # every 30s into the logs. /api/health is a lightweight JSON route
      # that doesn't stream. (Dockerfile already targets this endpoint;
      # this just aligns the compose override.)
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  shared:
    name: shared-infrastructure_shared_network
    external: true
