name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_IMAGE: 919651863281.dkr.ecr.us-east-1.amazonaws.com/raizcloud/claude-tracker-web
  FUNCTION_NAME: raizcloud-claude-tracker-web
  ASSETS_BUCKET: raizcloud-claude-tracker-assets-919651863281
  SITE_URL: https://llm.raizhost.com
  CF_DISTRIBUTION_ID: E1CNTRS4U5EXW7
  POLLER_FUNCTIONS: raizcloud-claude-tracker-poller-t1 raizcloud-claude-tracker-poller-t2 raizcloud-claude-tracker-poller-t3

jobs:
  deploy:
    name: Build arm64 image, sync assets, update Lambda
    # Native arm64 runner: the Lambda is arm64, and QEMU-emulating a
    # Next.js build on amd64 blew past the 20-minute timeout (run 31037562884).
    runs-on: ubuntu-24.04-arm
    # 30, not 20: `aws cloudfront wait invalidation-completed` polls for up to
    # ~10 minutes on top of the arm64 image build.
    timeout-minutes: 30
    # Run only when CI on main succeeded, or on manual dispatch.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    steps:
      - name: Resolve deploy SHA
        id: sha
        run: |
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "Deploying commit ${SHA}"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.sha.outputs.sha }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::919651863281:role/raizcloud-claude-tracker-deploy
          aws-region: ${{ env.AWS_REGION }}

      # Fail BEFORE anything ships if the role is missing a permission a later
      # step needs. Without this, a missing cloudfront grant surfaces only after
      # `update-function-code` has already deployed, leaving a red pipeline over
      # a live-but-unverified Lambda and an un-flushed edge.
      - name: Pre-flight — verify deploy permissions
        run: |
          fail() { echo "::error::$1"; exit 1; }
          aws cloudfront list-invalidations \
            --distribution-id "${CF_DISTRIBUTION_ID}" --max-items 1 >/dev/null 2>&1 \
            || fail "role raizcloud-claude-tracker-deploy cannot read CloudFront invalidations. Add cloudfront:CreateInvalidation, GetInvalidation and ListInvalidations on arn:aws:cloudfront::919651863281:distribution/${CF_DISTRIBUTION_ID} to its inline policy deploy-perms."
          for FN in ${POLLER_FUNCTIONS}; do
            aws lambda get-function-configuration --function-name "${FN}" >/dev/null 2>&1 \
              || fail "role raizcloud-claude-tracker-deploy cannot read poller function ${FN}. Add lambda:UpdateFunctionCode, GetFunctionConfiguration and InvokeFunction on the three raizcloud-claude-tracker-poller-* functions to its inline policy deploy-perms."
          done
          echo "Pre-flight OK."

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Runners are amd64; the Lambda is arm64.
      - uses: docker/setup-buildx-action@v3

      # Lambda requires Docker v2 manifests: no provenance/SBOM attestation
      # manifests and no OCI media types, hence the explicit output flags.
      - name: Build and push arm64 image (Docker v2 manifest)
        env:
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --provenance=false \
            --sbom=false \
            --output "type=image,\"name=${ECR_IMAGE}:${SHA},${ECR_IMAGE}:production-arm64\",oci-mediatypes=false,push=true" \
            .

      - name: Extract .next/static from pushed image
        env:
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          docker pull --platform linux/arm64 "${ECR_IMAGE}:${SHA}"
          docker create --platform linux/arm64 --name static-extract "${ECR_IMAGE}:${SHA}"
          docker cp static-extract:/app/.next/static ./extracted-static
          docker rm static-extract

      # Assets must land in S3 BEFORE the Lambda starts serving HTML that
      # references the new hashed bundles. No --delete: old bundles keep
      # serving in-flight pages during the rollover.
      - name: Sync static assets to S3
        run: |
          aws s3 sync ./extracted-static "s3://${ASSETS_BUCKET}/_next/static" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Update Lambda function code
        env:
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          aws lambda update-function-code \
            --function-name "${FUNCTION_NAME}" \
            --image-uri "${ECR_IMAGE}:${SHA}" \
            --architectures arm64 \
            --no-cli-pager

      - name: Wait for Lambda update to succeed
        run: |
          for i in $(seq 1 60); do
            STATUS=$(aws lambda get-function-configuration \
              --function-name "${FUNCTION_NAME}" \
              --query LastUpdateStatus --output text)
            echo "LastUpdateStatus: ${STATUS} (attempt ${i})"
            case "${STATUS}" in
              Successful) exit 0 ;;
              Failed)
                aws lambda get-function-configuration \
                  --function-name "${FUNCTION_NAME}" \
                  --query '{Status:LastUpdateStatus,Reason:LastUpdateStatusReason,Code:LastUpdateStatusReasonCode}' \
                  --output json
                echo "::error::Lambda update failed"
                exit 1 ;;
              *) sleep 5 ;;
            esac
          done
          echo "::error::Timed out waiting for Lambda update to complete"
          exit 1

      # The three scheduled poller Lambdas are Zip functions, separate from the
      # web container image. Until now they had NO deploy path in this repo —
      # they were hand-uploaded artifacts last modified 2026-06-22 — so every
      # ingest fix here was undeliverable and the site could silently run against
      # poller code from a different source tree. They ship with the site now.
      # The rest of this job runs Docker, so node deps are not installed yet.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build poller bundle
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:poller
          ls -l poller.zip

      - name: Update poller functions
        run: |
          for FN in ${POLLER_FUNCTIONS}; do
            echo "Updating ${FN}"
            aws lambda update-function-code \
              --function-name "${FN}" \
              --zip-file fileb://poller.zip \
              --no-cli-pager >/dev/null
          done
          for FN in ${POLLER_FUNCTIONS}; do
            for i in $(seq 1 60); do
              STATUS=$(aws lambda get-function-configuration \
                --function-name "${FN}" --query LastUpdateStatus --output text)
              case "${STATUS}" in
                Successful) echo "${FN}: Successful"; break ;;
                Failed) echo "::error::${FN} update failed"; exit 1 ;;
                *) sleep 5 ;;
              esac
              if [ "${i}" = "60" ]; then echo "::error::${FN} update timed out"; exit 1; fi
            done
          done

      # Run each tier once, synchronously. Two jobs at once: it proves the new
      # poller code actually executes in the VPC (a bundling mistake shows up
      # here, not silently 30 minutes later), and it populates the rows the smoke
      # test asserts on — EventBridge would not fire T2 for up to 30 minutes.
      - name: Smoke-invoke each poller tier
        run: |
          for FN in ${POLLER_FUNCTIONS}; do
            OUT=$(mktemp)
            RESP=$(aws lambda invoke --function-name "${FN}" \
              --cli-binary-format raw-in-base64-out --payload '{}' \
              --query 'FunctionError' --output text "${OUT}")
            echo "${FN}: ${RESP}"
            cat "${OUT}"; echo
            if [ "${RESP}" != "None" ]; then
              echo "::error::${FN} returned FunctionError=${RESP}"
              exit 1
            fi
          done

      # Invalidate the CDN so the new Cache-Control actually takes effect.
      #
      # Without this, CloudFront keeps serving whatever it already holds: the old
      # responses carried `stale-while-revalidate=31535700` (one year), so a
      # single empty response could sit at the edge for months. /claude/status was
      # observed at age=91895s against s-maxage=60.
      #
      # Requires cloudfront:CreateInvalidation + GetInvalidation on the
      # distribution in the raizcloud-claude-tracker-deploy role's inline policy.
      - name: Invalidate CloudFront
        run: |
          ID=$(aws cloudfront create-invalidation \
            --distribution-id "${CF_DISTRIBUTION_ID}" \
            --paths '/*' \
            --query 'Invalidation.Id' --output text)
          echo "Invalidation ${ID} created; waiting for completion"
          aws cloudfront wait invalidation-completed \
            --distribution-id "${CF_DISTRIBUTION_ID}" --id "${ID}"
          echo "Invalidation ${ID} completed"

      # Deploy gate. HTTP 200 is NOT sufficient: for weeks this site returned 200
      # on every page while rendering "No events yet" from a build-time prerender
      # made with no DATABASE_URL, and this smoke test passed every single time.
      # Assert that the pages actually contain DATA.
      - name: Smoke test production
        run: |
          fail() { echo "::error::$1"; exit 1; }

          # 1. Liveness + database reachability.
          HEALTH=$(curl -sS --max-time 30 "${SITE_URL}/api/health")
          echo "health: ${HEALTH}"
          echo "${HEALTH}" | grep -q '"db":"up"' \
            || fail "Smoke test failed — /api/health does not report db:up (${HEALTH})"

          # 2. Every data-backed page must render real rows, not an empty state.
          #    One page per provider per surface: an empty state anywhere here
          #    means the origin lost its database or the render regressed.
          for PATH_ in / /claude/changelog /openai/changelog /gemini/changelog \
                       /claude/releases /openai/releases /gemini/releases \
                       /claude/status /openai/status /gemini/status; do
            BODY=$(curl -sS --max-time 45 "${SITE_URL}${PATH_}")
            CODE=$?
            [ "${CODE}" = "0" ] || fail "Smoke test failed — curl error ${CODE} on ${PATH_}"
            case "${BODY}" in
              *"No events yet"*|*"No releases yet"*|*"Status stream warming up"*|*"Nothing has been ingested"*)
                fail "Smoke test failed — ${PATH_} rendered an EMPTY STATE. The origin is not reading the database." ;;
            esac
            echo "ok: ${PATH_} ($(printf '%s' "${BODY}" | wc -c) bytes)"
          done

          # 3. The feeds must be well-formed and non-empty.
          FEED=$(curl -sS --max-time 30 "${SITE_URL}/rss.xml")
          printf '%s' "${FEED}" | grep -q "<item>" \
            || fail "Smoke test failed — /rss.xml contains no items"

          echo "Deploy verified: ${SITE_URL} is serving live data."
