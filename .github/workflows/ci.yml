name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'content/**', 'next.config.ts') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # No DATABASE_URL on purpose — the build must not need VPC access to the
      # production database. That is exactly why the next step exists: with no
      # DATABASE_URL, anything prerendered here is prerendered EMPTY.
      - name: Build
        run: npm run build

      # The check that would have caught the outage: a DB-backed route that gets
      # prerendered ships an empty snapshot, and the Lambda's read-only
      # filesystem cannot durably replace it.
      - name: Assert no DB-backed route is prerendered
        run: npm run check:prerender

      # The poller bundle must build and load, or the ingest half of the deploy
      # fails after the web half has already shipped.
      - name: Build poller bundle
        run: npm run build:poller
